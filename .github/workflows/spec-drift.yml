name: Spec drift

# Catches the vendored openapi.json falling behind the deployed API. A red run
# means: run `npm run sync:spec && npm run gen:types` and open a PR.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run spec:drift
